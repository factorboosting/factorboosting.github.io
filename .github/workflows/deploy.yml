# Auto-deploy to Cloudflare Pages on every push to main.
#
# Why a GitHub Action instead of Cloudflare's native Git integration: connecting
# Cloudflare's Git integration to this org repo requires installing the Cloudflare
# GitHub App on the `factorboosting` org (an org-owner approval). This Action needs
# none of that — it runs inside the repo (push access only) and deploys using a
# Cloudflare API token stored as a repo secret.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   CLOUDFLARE_API_TOKEN   - a token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  - f1fb07d6df5731d10f57baeed31a89da
#
# The Supabase keys are NOT needed here: they live as secrets on the Cloudflare
# Pages project itself and are injected at runtime, not at deploy time. The build
# (scripts/build-site.mjs) has no npm dependencies and ships only static assets.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Don't let two deploys race; the newest push wins.
concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build static site -> dist/
        run: node scripts/build-site.mjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=factorboosting --branch=main
