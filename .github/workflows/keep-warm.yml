# Keep-warm: Supabase free-tier projects pause after 7 days with no activity. This
# pings the deployed /api/backtest?warm=1 endpoint daily, which runs a tiny Postgres
# query (get_universe_meta) and keeps the database awake.
#
# Why a GitHub Action instead of a Cloudflare Cron Trigger: Cloudflare Pages Functions
# do not support cron/scheduled handlers (that's a standalone-Worker feature). A
# scheduled Action lives in this same repo, needs no second Cloudflare deployment, and
# is trivial to read and edit. The warm endpoint is public (no secrets) — it returns
# only universe metadata.
#
# Setup: set a repo variable PAGES_URL to the deployed origin, e.g.
#   Settings -> Secrets and variables -> Actions -> Variables -> New variable
#   PAGES_URL = https://factorboosting.pages.dev
# If unset, the job is skipped (so forks / pre-deploy don't fail).

name: keep-warm

on:
  schedule:
    # 06:30 UTC daily (~12:00 IST). Cron is best-effort on GitHub's shared runners.
    - cron: "30 6 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping warm endpoint for each universe
        env:
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: |
          if [ -z "$PAGES_URL" ]; then
            echo "PAGES_URL repo variable not set; skipping keep-warm."
            exit 0
          fi
          base="${PAGES_URL%/}"
          for u in all top500 top300; do
            echo "Warming $u ..."
            code=$(curl -s -o /dev/null -w "%{http_code}" "$base/api/backtest?warm=1&universe=$u")
            echo "  -> HTTP $code"
          done
